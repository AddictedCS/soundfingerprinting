name: Create release from /master

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    permissions:
      contents: write   # create the GitHub release and its tag
      id-token: write   # GitHub OIDC token, exchanged for a temporary nuget.org API key (trusted publishing)
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v3
    - name: Read Package Version
      id: define_variables
      run: |
        VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Directory.Build.props)
        echo "sf_core_version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Ensure Version Was Bumped
      # nuget.org is the record of a release, so a version whose publish failed is retried by the next push to master
      run: |
        VERSION="${{ steps.define_variables.outputs.sf_core_version }}"
        if curl -fsS https://api.nuget.org/v3-flatcontainer/soundfingerprinting/index.json | grep -q "\"${VERSION,,}\""; then
          echo "::error::v$VERSION is already on nuget.org. Run ./bump.sh on develop before merging to master."
          exit 1
        fi
    - name: Run Tests
      run: dotnet test src/SoundFingerprinting.Tests/SoundFingerprinting.Tests.csproj -c Release -v n -tl:off
    - name: Pack
      run: dotnet pack src/SoundFingerprinting/SoundFingerprinting.csproj -c Release -o artifacts -tl:off
    # the temporary API key is valid for 1 hour, so it is requested right before the push
    - name: NuGet Login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: AddictedCS
    - name: Publish to NuGet
      run: |
        dotnet nuget push "artifacts/SoundFingerprinting.${{ steps.define_variables.outputs.sf_core_version }}.nupkg" \
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json
    - name: Check Release Tag
      id: release_tag
      # an earlier run whose publish failed may have created the tag already. The remote URL, not the checkout: the
      # container runs git as a user that does not own the workspace, so git ignores that clone after the checkout step
      run: |
        if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/v${{ steps.define_variables.outputs.sf_core_version }}" > /dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Create Release
      if: steps.release_tag.outputs.exists != 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.define_variables.outputs.sf_core_version }}
        release_name: Release ${{ steps.define_variables.outputs.sf_core_version }}
        draft: false
        prerelease: ${{ contains(steps.define_variables.outputs.sf_core_version, '-') }}
    - name: Slack Success Notification
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: '#3278BD'
        SLACK_MESSAGE: 'SoundFingerprinting v${{ steps.define_variables.outputs.sf_core_version }} published to NuGet, GitHub release created'
        SLACK_USERNAME: rtCamp
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    - name: Slack Failure Notification
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_COLOR: '#3278BD'
        SLACK_MESSAGE: 'SoundFingerprinting Core library release failed on master branch (missing version bump, failing tests or NuGet publish, check logs)'
        SLACK_USERNAME: rtCamp
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
